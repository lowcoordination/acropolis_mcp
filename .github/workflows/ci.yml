name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # No job-level timeout previously — a hung step (see the "Run pytest" step-level timeout
    # below for the specific incident this guards against) ran until GitHub Actions' 6h default
    # instead of failing loud within minutes. 20 minutes is real headroom above every observed
    # healthy run (dependency install ~15-20s, full suite ~5-9 min against the CI-provisioned
    # Postgres container) without being so tight that ordinary day-to-day variance in shared
    # runner load starts producing false-positive timeouts.
    timeout-minutes: 20
    # Issue #31: provided as a service container rather than left to the test fixture's own
    # `docker run` fallback, so these tests are deterministically RUN here rather than skipped.
    # The backend's whole value is an atomicity guarantee under concurrency — a claim that must
    # be exercised in CI, not quietly importorskip-ed away.
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 63801:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ACROPOLIS_TEST_VALKEY_URL: redis://127.0.0.1:63801/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The 'distributed' extra is required for tests/integration/test_rate_limit_valkey.py to
      # import at all (it importorskips on `redis`). Paired with the valkey service container
      # above, which supplies ACROPOLIS_TEST_VALKEY_URL — both are needed, and the fixture now
      # raises rather than skips when CI is set and neither is available.
      - name: Install package + dev dependencies
        run: python -m pip install --no-cache-dir '.[dev,distributed]'

      # Step-level timeout narrower than the job's own, so a hang here specifically produces a
      # clear "Run pytest" timeout rather than a generic job-level one — easier to diagnose from
      # the Actions UI alone, without needing to pull the full log the way this incident required.
      # 15 min covers the full local suite (~5-9 min healthy) plus
      # tests/integration/test_no_otel_installed.py's no_otel_venv fixture, which builds a
      # SECOND from-scratch venv and pip-installs into it mid-suite (a real, deliberate design —
      # proving OTel is genuinely uninstallable rather than mocking the ImportError — not
      # something to remove). That fixture is now hardened against the specific failure this
      # incident hit (see its own _run_with_hard_timeout — a plain subprocess.run's timeout
      # doesn't reliably reap pip's own grandchild processes under degraded runner network
      # conditions); this step timeout is the outer backstop in case a future hang isn't one
      # that fix covers, not a substitute for it.
      # -rs prints a one-line reason for every SKIPPED test. Without it `-q` reports only a
      # count, and "N skipped" is indistinguishable between "an optional dependency is
      # legitimately absent" and "a test suite you believed was running silently isn't" —
      # a distinction that cost real debugging time on issue #31's Valkey backend.
      - name: Run pytest
        timeout-minutes: 15
        run: python -m pytest -q -rs

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Lint
        run: npm run lint

  # Epic #89: benches are `python -m` scripts outside pytest collection — nothing ran them in
  # CI, so they rot invisibly (an import error, a drifted helper, and the first anyone knows is
  # the next time the numbers are needed). The repo's own stated principle: "a green run that
  # silently measured nothing would be the single worst outcome." This job is a RUNNABILITY
  # gate, deliberately NOT a performance gate: every bench's --smoke mode floors its iteration
  # counts, asserts no numbers, and exits 0. The numbers are human-reviewed artifacts (checked
  # into tests/bench/results/) — shared runners are far too noisy for ms-level gates.
  #
  # Deliberately excluded: tests/bench/load/ — a multi-container compose load test on a shared
  # runner is a flake farm; it is local/pre-release only (see that module's docstring).
  bench-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Same sourcing the rate-limit bench's harness uses (ACROPOLIS_TEST_VALKEY_URL beats the
      # docker fallback), on the harness's own bench port so a same-runner collision with the
      # backend job's 63801 can't happen even if both jobs ever share a runner.
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 63802:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ACROPOLIS_TEST_VALKEY_URL: redis://127.0.0.1:63802/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 'otel' is required by bench_otel (its docstring says so; the backend job's pytest suite
      # deliberately runs WITHOUT it to prove OTel absence degrades cleanly — benches measure
      # the code path that only exists with it). 'distributed' is required by bench_rate_limit's
      # redis client. Postgres needs no service: the harness docker-runs one, exactly as the
      # backend job's pytest suite already provisions it on the runner (ci.yml has no postgres
      # service; conftest.py's docker fallback is what supplies it there).
      - name: Install package + dev/deps for benches
        run: python -m pip install --no-cache-dir '.[dev,distributed,otel]'

      # Step-level timeout narrower than the job's own, mirroring the "Run pytest" step's
      # pattern — a hung bench must surface as a clear "Run benches --smoke" timeout.
      # Healthy smoke runs take seconds per bench (~2-3 min total including PG provisioning).
      - name: Run benches in --smoke mode
        timeout-minutes: 8
        run: |
          python -m tests.bench.bench_dlp --smoke
          python -m tests.bench.bench_redos --smoke
          python -m tests.bench.bench_otel --smoke
          python -m tests.bench.bench_rate_limit --smoke
          python -m tests.bench.bench_quotas --smoke
          python -m tests.bench.bench_pipeline --smoke
