apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: acropolis-data
  namespace: acropolis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Postgres is now where config + audit log live (enterprise #7, issue #8) — this volume is
      # no longer database storage. It's kept only because ACROPOLIS_DATA_DIR is still the
      # documented location for non-database on-disk state (e.g. ACROPOLIS_SECRET_KEY_FILE's
      # default neighbourhood, see docs/secrets.md) and removing it would break existing
      # deployments' mounts for no benefit. 1Gi is generous for that much smaller footprint;
      # shrink it if you're provisioning fresh.
      storage: 1Gi
  # No storageClassName set — uses your cluster's default.
