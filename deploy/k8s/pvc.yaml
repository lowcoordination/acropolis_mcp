apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: acropolis-data
  namespace: acropolis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # SQLite (config + audit log). 1Gi is generous for a homelab-scale deployment; raise
      # this if you expect a large audit log and a long retention window.
      storage: 1Gi
  # No storageClassName set — uses your cluster's default. Set one explicitly if you need a
  # specific class (e.g. a fast SSD-backed class, since SQLite is latency-sensitive on writes).
