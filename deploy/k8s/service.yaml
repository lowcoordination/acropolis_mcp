apiVersion: v1
kind: Service
metadata:
  name: argus
  namespace: argus
spec:
  # ClusterIP by default — reach Argus via `kubectl port-forward` for a quick look, or (more
  # realistically) put an Ingress in front of it (see ingress.yaml.example in this directory)
  # so it gets a real hostname and TLS. Change to LoadBalancer if your cluster provisions
  # external IPs (e.g. MetalLB, a cloud LB controller) and you want one directly:
  #
  #   type: LoadBalancer
  #
  type: ClusterIP
  selector:
    app: argus
  ports:
    - name: http
      port: 8000
      targetPort: http
