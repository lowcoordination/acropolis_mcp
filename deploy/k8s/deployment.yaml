apiVersion: apps/v1
kind: Deployment
metadata:
  name: acropolis
  namespace: acropolis
  labels:
    app: acropolis
spec:
  replicas: 1  # SQLite-backed; don't scale beyond 1 replica without moving to a shared DB first
  strategy:
    type: Recreate  # avoids two pods writing the same SQLite files at once during a rollout
  selector:
    matchLabels:
      app: acropolis
  template:
    metadata:
      labels:
        app: acropolis
    spec:
      # Uncomment and set if your registry requires auth:
      # imagePullSecrets:
      #   - name: your-registry-creds

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: acropolis
          # Replace with wherever you've pushed the built image (see the repo's Dockerfile).
          image: acropolis:latest
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          envFrom:
            - configMapRef:
                name: acropolis-config
          env:
            - name: ACROPOLIS_DATA_DIR
              value: /data
            # Optional: a bearer-token override for the /api/v1 control plane (CI/automation
            # only — normal use goes through the browser login flow instead). Uncomment and
            # point at a real Secret if you want this.
            # - name: ACROPOLIS_ADMIN_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: acropolis-admin-token
            #       key: token

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp

          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: acropolis-data
        # readOnlyRootFilesystem above needs a writable /tmp — the forkserver used for
        # ReDoS-safe policy matching (argus/policy.py) allocates semaphores/sockets there, and
        # uvicorn/stdlib internals assume it's writable even when the app itself never touches it.
        - name: tmp
          emptyDir: {}
