apiVersion: apps/v1
kind: Deployment
metadata:
  name: acropolis
  namespace: acropolis
  labels:
    app: acropolis
spec:
  # Raising this is SUPPORTED, but has a hard prerequisite — read docs/rate-limiting.md first.
  #
  # REQUIRED before replicas > 1: set ACROPOLIS_RATE_LIMIT_BACKEND=valkey (plus
  # ACROPOLIS_RATE_LIMIT_BACKEND_URL). The default rate-limit backend keeps token buckets in
  # process memory, so N replicas would enforce N INDEPENDENT copies of every configured limit —
  # a 100/minute policy becoming 100*N/minute in practice. That is a silent security-control
  # bypass: nothing logs it, no metric shows it, and the policy page keeps displaying the
  # configured value. The Valkey backend puts the buckets in one store all replicas share.
  #
  # Left at 1 as the DEFAULT because that is correct for a deployment that hasn't configured
  # Valkey — which is every deployment out of the box. This is a default, not a prohibition.
  #
  # Also size for the replica count when you raise it:
  #   - Postgres max_connections vs. N * (ACROPOLIS_DB_WRITER_POOL_MAX +
  #     ACROPOLIS_DB_READER_POOL_MAX) — see docs/postgres.md
  #
  # Two behaviours change with N replicas and are worth knowing about (neither blocks scaling;
  # both are documented in docs/rate-limiting.md's "What changes when you run more than one
  # replica"):
  #   - Webhook debounce/threshold state is per-process (stoa/webhooks.py), so a threshold alert
  #     can fire up to once PER REPLICA rather than exactly once.
  #   - Every replica runs its own health poller (stoa/health.py), multiplying upstream probe
  #     traffic by the replica count.
  #
  # Quota enforcement is NOT affected: both halves of its window live in shared Postgres — see
  # docs/quotas.md's "Running more than one replica".
  replicas: 1
  # No `strategy:` override — RollingUpdate (the Deployment default) is safe now. Pre-cutover
  # this was pinned to `Recreate` because SQLite's single-writer model meant two pods briefly
  # running side by side during a rollout would mean two processes fighting over the same
  # on-disk files. Postgres, not a per-process lock, now serializes concurrent writers, so that
  # constraint is gone.
  selector:
    matchLabels:
      app: acropolis
  template:
    metadata:
      labels:
        app: acropolis
    spec:
      # Uncomment and set if your registry requires auth:
      # imagePullSecrets:
      #   - name: your-registry-creds

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: acropolis
          # Replace with wherever you've pushed the built image (see the repo's Dockerfile).
          image: acropolis:latest
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          envFrom:
            - configMapRef:
                name: acropolis-config
          env:
            - name: ACROPOLIS_DATA_DIR
              value: /data
            # Postgres is a hard boot requirement (enterprise #7, issue #8) — see
            # db/database.py's DatabaseNotConfiguredError and docs/postgres.md. This manifest
            # set deliberately does NOT bundle a Postgres StatefulSet: it treats the database the
            # same way it already treats ACROPOLIS_ADMIN_TOKEN below — an operator-supplied
            # external dependency, wired through a Secret this repo doesn't create for you.
            # Point it at a managed instance (RDS, Cloud SQL, ...) or a Postgres you run
            # elsewhere in-cluster; create the Secret yourself, e.g.:
            #   kubectl -n acropolis create secret generic acropolis-db \
            #     --from-literal=url='postgresql://user:pass@host:5432/acropolis'
            - name: ACROPOLIS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: acropolis-db
                  key: url
            # Optional: a bearer-token override for the /api/v1 control plane (CI/automation
            # only — normal use goes through the browser login flow instead). Uncomment and
            # point at a real Secret if you want this.
            # - name: ACROPOLIS_ADMIN_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: acropolis-admin-token
            #       key: token

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp

          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: acropolis-data
        # readOnlyRootFilesystem above needs a writable /tmp — the forkserver used for
        # ReDoS-safe policy matching (argus/policy.py) allocates semaphores/sockets there, and
        # uvicorn/stdlib internals assume it's writable even when the app itself never touches it.
        - name: tmp
          emptyDir: {}
