[project]
name = "acropolis"
version = "0.1.0"
description = "Acropolis (Argus/Archon/Stoa) — a self-hostable MCP gateway, policy engine, and registration hub"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "PyYAML>=6.0.2",
    # Enterprise #7: Postgres is a hard requirement post-cutover (db/database.py, db/repo.py) —
    # asyncpg belongs in the base install, not an optional extra, same as fastapi/uvicorn.
    # aiosqlite (the pre-cutover driver) is gone: there is no SQLite code path left to need it.
    "asyncpg>=0.29.0",
    # Enterprise #5: AES-GCM envelope encryption for the "encrypted" secret provider tier
    # (archon/secrets/encrypted.py). No other module in this codebase does cryptography of its
    # own — password hashing (archon/passwords.py) and API key hashing use stdlib hashlib.
    "cryptography>=42.0.0",
    # #112: re2 fast path for operator regexes (block_patterns, DLP custom patterns). re2
    # guarantees linear-time matching, so any pattern it accepts is matched inline on the event
    # loop with no timeout process; the forkserver machinery in argus/policy.py remains as the
    # fallback for patterns re2 rejects (backreferences/lookarounds), keeping fail-closed
    # UNDETERMINED semantics unchanged. Ships cp312/cp314 manylinux wheels (verified 1.1.2025).
    "google-re2>=1.1.2024",
]

[project.optional-dependencies]
# Issue #31: the shared-state rate-limit backend needed to run more than one replica. Optional
# on purpose — InMemoryBackend remains the default (argus/rate_limiter.py) and a single-replica
# deployment must not be made to install a client for a server it will never talk to. Install
# with `pip install acropolis[distributed]` when running multi-replica; argus/app.py raises a
# clear configuration error if ACROPOLIS_RATE_LIMIT_BACKEND=valkey is set without it.
#
# redis-py, not valkey-py: it is the mature client and speaks the same wire protocol, so it
# works unchanged against both Valkey and Redis servers. The image this project's compose and
# tests use is valkey/valkey (BSD-licensed, the maintained fork post-2024) — the client library
# choice does not constrain the server you point it at.
distributed = [
    "redis>=5.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    # Pinned to 1.29.0 (protocol 2025-06-18) to match the real upstream fleet's generation —
    # the mcp package's own 2.0.0 already speaks the 2026-07-28 stateless spec, which is the
    # generation Argus needs to BRIDGE to, not the one its test fixtures should emulate as upstream.
    "mcp>=1.29.0,<2.0.0",
]
# Enterprise #9: OpenTelemetry tracing. Deliberately a SEPARATE optional-dependencies group from
# `dev`, not folded into it — `dev` is "what CI and contributors need to run the test suite",
# and the whole point of this extra is that the base install (and, by extension, `dev`) works
# with these packages absent, proving ACROPOLIS_OTEL_ENABLED=true degrades to a logged no-op
# rather than a crash when they aren't installed. `pip install acropolis[otel]` (or
# `pip install -e ".[dev,otel]"` for a contributor who wants both) opts in. See argus/tracing.py
# and docs/observability.md.
otel = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[project.scripts]
acropolis = "argus.__main__:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["argus*", "archon*", "stoa*", "db*"]

[tool.setuptools.package-data]
# db/database.py resolves MIGRATIONS_DIR relative to its own file location (not
# importlib.resources), so the .sql files must land on disk next to database.py for ANY install
# method — not just the Docker image, where `COPY db/ ./db/` happens to preserve them by copying
# the raw source tree rather than building a wheel. Without this, `pip install .` (e.g. the
# `acropolis` console-script entry point installed from a real wheel/sdist) silently drops every
# migration file, and the first `db.connect()` call 500s with FileNotFoundError.
db = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
